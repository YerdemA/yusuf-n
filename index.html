<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derin Hanım'a Mektuplar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Dokular -->
    <div class="texture-overlay"></div>
    <div class="vignette"></div>

    <!-- MÜZİK ÇALAR -->
    <div class="music-player-container" id="music-player">
        <div class="music-info" id="music-title">Yükleniyor...</div>
        <button class="gramophone-btn" id="music-toggle" title="Müziği Başlat/Durdur">
            ▶
        </button>
    </div>

    <!-- YAZMA BUTONU (FAB) -->
    <div class="fab-container" id="write-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
            <line x1="16" y1="8" x2="2" y2="22"></line>
            <line x1="17.5" y1="15" x2="9" y2="15"></line>
        </svg>
    </div>

    <!-- ALBÜM BUTONU -->
    <div class="album-btn-container" id="album-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
    </div>

    <!-- GÖNDERİLEN MEKTUPLAR ALANI -->
    <div class="sent-envelopes-area" id="sent-envelopes-area"></div>

    <div id="app">

        <!-- SAHNE 0: GİRİŞ KAPISI (Log-in) -->
        <section id="scene-login" class="scene active">
            <div class="login-container">
                <input type="password" id="login-input" placeholder="Şifre..." autocomplete="off">
                <button id="login-btn">Gir</button>
            </div>
        </section>

        <!-- SAHNE 1: KARŞILAMA -->
        <section id="scene-landing" class="scene">
            <h1 class="title">Hoşgeldiniz</h1>
            <div class="arrow-container" id="start-btn">
                <div class="arrow">↓</div>
            </div>
        </section>

        <!-- SAHNE 2: SEÇİM -->
        <section id="scene-selection" class="scene">
            <p class="intro-text" id="intro-text">Sizin için 2 tane mektubumuz var Derin Hanım,<br>önce hangisini okumak
                istersiniz?</p>

            <div class="envelopes-wrapper">
                <div class="envelope-container" id="env-1" data-letter="letter1">
                    <div class="envelope">
                        <div class="paper-preview"></div> <!-- En altta -->

                        <!-- Zarf Parçaları -->
                        <div class="pocket-left"></div>
                        <div class="pocket-right"></div>
                        <div class="pocket-bottom"></div>

                        <div class="flap"></div>

                        <div class="letter-label">Özür Mektubu</div>
                    </div>
                </div>

                <div class="envelope-container" id="env-2" data-letter="letter2">
                    <div class="envelope">
                        <div class="paper-preview"></div>

                        <div class="pocket-left"></div>
                        <div class="pocket-right"></div>
                        <div class="pocket-bottom"></div>

                        <div class="flap"></div>

                        <div class="letter-label">16 Aralık</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SAHNE 2.5: ALBÜM -->
        <section id="scene-album" class="scene">
            <h2 class="album-title">Bizim Hikayemiz</h2>
            <div class="album-controls">
                <div class="upload-btn" id="upload-trigger-btn"> Fotoğraf Ekle +</div>
                <input type="file" id="photo-upload-input" accept="image/*" style="display: none;">
                <div class="back-btn" id="close-album-btn">← Geri Dön</div>
            </div>

            <div class="album-grid" id="album-grid">
                <!-- Fotoğraflar buraya JS ile eklenecek -->
                <div class="photo-frame-empty">
                    <p>Henüz fotoğraf yok...</p>
                </div>
            </div>
        </section>

        <!-- SAHNE 3: OKUMA -->
        <section id="scene-reading" class="scene">
            <div class="overlay-bg" id="close-area"></div>
            <div class="parchment" id="parchment-container">
                <div class="parchment-content">
                    <p id="letter-text"></p>
                </div>
                <div class="close-hint" id="close-btn-text">(Kapatmak için tıklayın)</div>
            </div>
        </section>

        <!-- DOĞUM GÜNÜ SÜRPRİZİ (YENİ) -->
        <div id="birthday-modal" class="birthday-modal">
            <div id="confetti-container"></div>
            <div id="hearts-container"></div>
            <div id="candles-container"></div>

            <div class="countdown-display" id="countdown-display"></div>
            <div class="final-message" id="final-message">İyi ki doğdun,<br>benim güzel Derin'im!</div>
        </div>

        <!-- SAHNE 4: YAZMA MODÜLÜ (MODAL) -->
        <div class="writing-modal" id="writing-modal">
            <div class="overlay-bg-write"></div>
            <div class="writing-parchment">
                <input type="text" class="write-title" id="write-title" maxlength="16" placeholder="Başlık (Maks 16)">
                <textarea class="write-body" id="write-body" placeholder="Hislerinizi buraya dökün..."></textarea>
                <div class="seal-btn-container">
                    <div class="wax-seal-btn" id="seal-btn">Mühürle</div>
                </div>
                <div class="close-write-hint" id="close-write-btn">(Vazgeç)</div>
            </div>
        </div>

    </div>

    <!-- GSAP Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script type="module" src="main.js"></script>
</body>

</html>
